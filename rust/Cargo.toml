[workspace]
resolver = "2"
members = [
    "transformer_scorer",
    "transformer_scorer_py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RenQuant"]
rust-version = "1.75"

[workspace.dependencies]
# Pure-Rust ML — supports Metal (MPS-equivalent) on Apple Silicon.
candle-core = { version = "0.8", default-features = false }
candle-nn   = { version = "0.8", default-features = false }
# safetensors is the load-from-disk format. Python side exports via
# scripts/export_transformer_to_safetensors.py.
safetensors = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"
clap        = { version = "=4.5.20", features = ["derive"] }
csv         = "1.3"
ndarray     = "0.16"
# Concurrency primitives — rayon for data-parallel batch scoring,
# parking_lot for low-overhead mutexes. ML training in Rust would lean
# on rayon for batch / param-grad parallelism on top of candle's BLAS.
rayon       = "1.10"
parking_lot = "0.12"
