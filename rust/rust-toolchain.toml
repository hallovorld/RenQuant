# Pinned toolchain — like environment.yml for Python, but Rust.
#
# `rustup` reads this file when invoked from anywhere inside the rust/
# subtree and ensures every contributor uses the same compiler version
# + components. Fully reproducible build.
#
# Bump deliberately: any toolchain change should land in its own commit
# with a CI-green build, never silently in a feature branch.
[toolchain]
channel    = "1.85.0"        # 2025-02 stable — has edition2024 for newer transitive deps.
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
profile    = "default"
# targets is empty — pure host build. Add cross-compile targets here
# only when we actually need them (e.g. "x86_64-unknown-linux-gnu" for
# Linux deploy from macOS dev box).
targets    = []
