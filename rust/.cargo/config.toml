# Cargo configuration scoped to the rust/ workspace.
# Equivalent role to ~/.condarc but per-project.

[build]
# Use as many cores as available; -j default of #cpus is fine but
# we set jobs=8 explicitly so CI logs are reproducible regardless of
# host machine size.
jobs = 8

[term]
verbose = false
color   = "auto"

# Apple Silicon — pass MACOSX_DEPLOYMENT_TARGET so Metal backend's
# Objective-C symbols link against the documented minimum.
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=12.0",
]

# Optional alias targets for common workflows.
# Run as: `cargo dev` / `cargo rls` / `cargo metal`.
[alias]
dev   = "build --workspace"
rls   = "build --workspace --release"
metal = "build --workspace --release --features metal"
test-all = "test --workspace --all-features"
fmt-check = "fmt --all -- --check"
lint  = "clippy --workspace --all-targets -- -D warnings"

# Reproducibility:
# Pin the registry index protocol so old git-based registry never sneaks
# back in (it's been dropped on stable but defensive is free).
[registries.crates-io]
protocol = "sparse"

# Networking — set sane timeouts so a flaky mirror doesn't hang CI.
[http]
timeout = 60
multiplexing = true
