[pytest]
# 2026-04-24: suite is ~1000 tests; wallclock was 25+ minutes in serial
# (lots of tests build synthetic OHLCV + fit small panel-LTR / NGBoost
# models). pytest-xdist drops this to a couple of minutes on 8 workers.
#
# -n auto  uses logical CPU count. Override with `pytest -n 4` (or 0 to
# disable) when debugging — xdist obscures tracebacks when multiple
# workers fail simultaneously.
#
# Invariant-heavy tests (test_no_trade_invariant, test_golden_preservation)
# opt-in via env vars: RENQUANT_FULL_SIM=1 and RENQUANT_REGRESSION=1.
#
# `env` sets environment for every test. OMP_NUM_THREADS=1 + MKL_NUM_THREADS=1
# prevent torch OpenMP thread collisions under xdist — without this,
# tests/test_panel_transformer.py hangs the worker that gets it. (Torch's
# default OpenMP pool sizes itself to logical-cores, and N xdist workers
# × M omp threads contend on the same lock on macOS.)
addopts = -n auto --durations=15
env =
    OMP_NUM_THREADS=1
    MKL_NUM_THREADS=1
    OPENBLAS_NUM_THREADS=1

testpaths =
    tests

# Stop listing every passed test; just show progress + failures.
# -q from command line overrides this.
log_cli = false
