name: agent-review-template
# Reusable G2 (auto-review) workflow. Implementation of
# `doc/ops/agent-automation.md` §4.2.
#
# Per-repo wrapper invokes this PER AGENT:
#
#   jobs:
#     claude-review:
#       uses: hallovorld/RenQuant/.github/workflows/_agent-review-template.yml@main
#       with: { agent: claude, model: claude-sonnet-4-6 }
#       secrets:
#         api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#     codex-review:
#       uses: hallovorld/RenQuant/.github/workflows/_agent-review-template.yml@main
#       with: { agent: codex, model: gpt-5-codex }
#       secrets:
#         api_key: ${{ secrets.OPENAI_API_KEY }}
#
# The wrapper owns: events (pull_request types), concurrency, changed_files
# gate. This template owns: live-label routing, per-agent skip
# (don't review own PR / manual-hold / cost-cap / draft), checkout,
# prompt assembly, LLM dispatch, comment posting.

on:
  workflow_call:
    inputs:
      agent:
        type: string
        required: true
        description: "claude or codex (determines which action + API key to use)"
      model:
        type: string
        required: true
        description: "Specific model id (e.g. claude-sonnet-4-6, gpt-5-codex)"
      prompt_path:
        type: string
        required: false
        default: ".github/agent-review-prompt.md"
        description: "Path (relative to repo root) of the review prompt template"
    secrets:
      api_key:
        required: false
        description: "Anthropic or OpenAI API key, depending on `agent` input"

permissions:
  contents: read
  pull-requests: write   # for posting review comments
  issues: write          # fallback/sticky PR comments are issue comments
  id-token: write        # claude-code-action@v1 + codex-action@v1 OIDC setup
                         # (2026-06-03 incident: missing this caused "Could not
                         # fetch an OIDC token" failure on both actions). Per-
                         # repo wrapper MUST also grant this in its `permissions:`
                         # block — reusable-workflow permissions are intersected,
                         # not unioned, so caller's set is the upper bound.

jobs:
  review:
    # Do not use github.event.pull_request.labels for routing here.
    # PR-open and label workflows race; the event payload can be stale.
    # The first step live-fetches labels and later steps key off its output.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve live review routing
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPO" --json labels,isDraft > pr.json
          LABELS_JSON=$(jq -c '[.labels[].name]' pr.json)
          IS_DRAFT=$(jq -r '.isDraft' pr.json)
          echo "live labels: $LABELS_JSON"

          should_review=true
          reason="review-required"
          if [ "$IS_DRAFT" = "true" ]; then
            should_review=false
            reason="draft-pr"
          elif echo "$LABELS_JSON" | grep -q '"agent:manual-hold"'; then
            should_review=false
            reason="manual-hold"
          elif echo "$LABELS_JSON" | grep -q '"agent:cost-cap"'; then
            should_review=false
            reason="cost-cap"
          elif echo "$LABELS_JSON" | grep -q "\"agent:${AGENT}\"" &&
               ! echo "$LABELS_JSON" | grep -q '"agent:needs-review"'; then
            should_review=false
            reason="self-review"
          fi

          echo "should_review=$should_review" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ "$should_review" = "false" ]; then
            echo "Skipping ${AGENT} review: ${reason}"
          else
            echo "Running ${AGENT} review: ${reason}"
          fi

      - name: Check agent API key availability
        if: steps.route.outputs.should_review == 'true'
        id: secret_gate
        env:
          AGENT: ${{ inputs.agent }}
          API_KEY: ${{ secrets.api_key }}
        run: |
          set -euo pipefail
          if [ -z "${API_KEY:-}" ]; then
            echo "::error::${AGENT} API key secret is not configured; failing closed so PRs cannot merge as reviewed when no review was possible"
            echo "has_api_key=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "has_api_key=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.route.outputs.should_review == 'true' && steps.secret_gate.outputs.has_api_key == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build review prompt
        if: steps.route.outputs.should_review == 'true' && steps.secret_gate.outputs.has_api_key == 'true'
        id: prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PROMPT_PATH: ${{ inputs.prompt_path }}
        run: |
          set -euo pipefail
          # Pull the per-repo prompt template when present. Subrepos may
          # start with only the lightweight workflow wrapper; keep review
          # automation functional by falling back to the RenQuant default.
          if [ -f "${PROMPT_PATH}" ]; then
            PROMPT_HEADER=$(cat "${PROMPT_PATH}")
          else
            echo "::warning::review prompt template missing at ${PROMPT_PATH}; using RenQuant default"
            PROMPT_HEADER=$(cat <<'DEFAULT_REVIEW_PROMPT'
          # Agent review prompt - RenQuant default
          
          You are reviewing a pull request against a RenQuant repository. Prioritize
          actual correctness, data-flow safety, tests, and operational regressions.
          
          ## What to look for
          
          1. Bugs: concrete logic, state, control-flow, or contract defects reachable
             from the changed code.
          2. Missing tests: changed behavior should be pinned by focused tests.
          3. Data-flow safety: stale artifact paths, recipe/config drift, NaN handling,
             leakage, hardcoded runtime paths, and broken cross-repo contracts.
          4. Operational risk: workflows, permissions, secrets, scheduled jobs, and
             automation should fail closed and be reproducible.
          
          ## What to skip
          
          - Style nits handled by linters.
          - Subjective preferences.
          - Existing pre-PR code not touched by the diff unless the PR depends on it.
          
          ## Output format
          
          Post one consolidated PR review. Lead with findings ordered BLOCKER, HIGH,
          MED, LOW. For each finding include location, evidence, and the smallest
          concrete fix. If there are no findings, say what CI and invariants you
          checked.
          DEFAULT_REVIEW_PROMPT
            )
          fi
          # Append the PR-specific context.
          git fetch --no-tags origin "${BASE_SHA}"
          DIFF=$(git diff --unified=3 "${BASE_SHA}..HEAD")
          PR_BODY=$(gh pr view "${PR_NUMBER}" --json body -q .body)
          # Multi-line output via heredoc-with-EOF (GH Actions standard).
          {
            echo "prompt<<PROMPT_EOF"
            echo "${PROMPT_HEADER}"
            echo ""
            echo "## PR #${PR_NUMBER} body"
            echo "${PR_BODY}"
            echo ""
            echo "## Diff (vs base ${BASE_SHA})"
            echo '```diff'
            echo "${DIFF}"
            echo '```'
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # Note: action input shapes already corrected at the use: sites
      # below. See README's "Action API contract (verified)" section.

      - name: Run agent (Claude)
        if: steps.route.outputs.should_review == 'true' && steps.secret_gate.outputs.has_api_key == 'true' && inputs.agent == 'claude'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.api_key }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          # claude_args restricts tool access: gh CLI for posting comments,
          # git for context, no Bash(rm) etc. --max-turns bounds runtime.
          claude_args: |
            --allowed-tools "Bash(gh:*),Bash(git:*)"
            --max-turns 10
            --model ${{ inputs.model }}

      - name: Run agent (Codex)
        if: steps.route.outputs.should_review == 'true' && steps.secret_gate.outputs.has_api_key == 'true' && inputs.agent == 'codex'
        id: codex
        uses: openai/codex-action@v1
        with:
          # codex-action@v1 inputs use DASHES (verified against
          # action.yml at v1 on 2026-06-01). The underscore form
          # `openai_api_key` was silently ignored — the action would
          # have run without the API key.
          openai-api-key: ${{ secrets.api_key }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          model: ${{ inputs.model }}

      # Fallback comment for Codex ONLY — claude-code-action self-posts
      # PR comments via its built-in `use_sticky_comment` /
      # `include_comments_by_actor` mechanism and does NOT expose a
      # `result` output a wrapper could read. A Claude fallback step
      # would be dead code (verified against the action.yml on 2026-06-01;
      # no result output defined). Codex returns `final-message`; we
      # surface it here for the reviewer to see what the agent
      # concluded.
      - name: Post Codex fallback comment
        if: always() && steps.route.outputs.should_review == 'true' && steps.secret_gate.outputs.has_api_key == 'true' && inputs.agent == 'codex'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODEX_RESULT: ${{ steps.codex.outputs.final-message }}
        run: |
          set -uo pipefail
          if [ -z "${CODEX_RESULT:-}" ] || [ "${CODEX_RESULT}" = "ok" ]; then
            echo "Codex posted its review directly OR returned no message; no fallback needed"
            exit 0
          fi
          # Marker so re-runs on the same head SHA don't double-post.
          MARKER="<!-- agent-review:codex:${HEAD_SHA} -->"
          BODY=$(printf '%s\n\n%s\n\n_Posted by codex agent-review workflow on commit %s._' \
            "$MARKER" "$CODEX_RESULT" "$HEAD_SHA")
          gh pr comment "$PR_NUMBER" --body "$BODY"

      # ── Severity gate: the CHECK must reflect the VERDICT ────────────────
      # 2026-06-04 (#199 incident): codex found 2 BLOCKER/HIGH issues but the
      # codex-review check went GREEN — because the action couldn't submit a
      # CHANGES_REQUESTED review (no token) and fell back to a plain comment,
      # and nothing translated "found a blocker" into a failing check. A green
      # review check was therefore readable as "approved" when it only meant
      # "the review job ran". This step closes that gap: it reads what the
      # agent actually concluded for THIS head SHA and FAILS the job (red
      # check) when a BLOCKER or HIGH finding is present, so branch protection
      # blocks merge until the author fixes and a re-review comes back clean.
      #
      # Verdict sources (union, for robustness across both agents):
      #   - codex: the action's final-message output (authoritative)
      #   - either: PR reviews whose commit_id == head SHA (state +
      #     body), and issue comments carrying this run's head SHA marker
      - name: Gate review check on verdict severity
        if: steps.route.outputs.should_review == 'true' && steps.secret_gate.outputs.has_api_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENT: ${{ inputs.agent }}
          CODEX_RESULT: ${{ steps.codex.outputs.final-message }}
        run: |
          set -euo pipefail
          verdict_file="$(mktemp)"
          # 1. codex direct output (if this is the codex job).
          if [ -n "${CODEX_RESULT:-}" ]; then
            printf '%s\n' "$CODEX_RESULT" >> "$verdict_file"
          fi
          # 2. PR reviews submitted against THIS head SHA (both agents).
          #    A CHANGES_REQUESTED review is an unconditional fail.
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate \
            --jq ".[] | select(.commit_id == \"${HEAD_SHA}\") | \"STATE:\(.state)\n\(.body)\"" \
            >> "$verdict_file" 2>/dev/null || true
          # 3. Issue comments carrying this run's head-SHA marker (covers the
          #    comment-fallback path that bit #199).
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${HEAD_SHA}\")) | .body" \
            >> "$verdict_file" 2>/dev/null || true

          if [ ! -s "$verdict_file" ]; then
            echo "::warning::no verdict text found for ${AGENT} at ${HEAD_SHA}; cannot confirm clean review. Treating as PASS (review ran, posted via a path this gate can't read) — but see #199: prefer agents that submit CHANGES_REQUESTED reviews."
            exit 0
          fi

          # Unconditional fail on an explicit changes-requested review.
          if grep -q 'STATE:CHANGES_REQUESTED' "$verdict_file"; then
            echo "::error::${AGENT} review submitted CHANGES_REQUESTED on ${HEAD_SHA} — failing the review check so merge is blocked until addressed."
            exit 1
          fi

          # Severity tags per the review-prompt format: **BLOCKER**,
          # [HIGH], 'BLOCKER —', 'HIGH:'. Word-bounded so 'high-throughput'
          # / 'blocking' (lowercase prose) don't false-positive. MED/LOW/nit
          # are NOT merge-blockers (author addresses at discretion).
          SEV='(\*\*(BLOCKER|HIGH)\*\*|\[(BLOCKER|HIGH)\]|(^|[[:space:]])(BLOCKER|HIGH)[[:space:]]*[:—-])'
          if grep -Eq "$SEV" "$verdict_file"; then
            hit="$(grep -Eo "$SEV" "$verdict_file" | sort -u | tr '\n' ' ')"
            echo "::error::${AGENT} review flagged blocking severity (${hit}) on ${HEAD_SHA}. Failing the review check — a green check must mean no BLOCKER/HIGH. Author fixes, then re-review must come back clean."
            exit 1
          fi
          echo "${AGENT} review clean at ${HEAD_SHA} (no CHANGES_REQUESTED, no BLOCKER/HIGH) — check passes."
