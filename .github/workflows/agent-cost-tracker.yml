name: agent-cost-tracker
# Per-PR LLM cost cap. Wraps RenQuant umbrella's reusable Phase D
# template per `doc/ops/agent-automation-v2-design.md §3.8`.

on:
  workflow_run:
    workflows: [agent-review, agent-autofix]
    types: [completed]

concurrency:
  # Serialize cost updates per workflow_run so two concurrent fires
  # don't double-count or race on the running-total label.
  group: agent-cost-tracker-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  track:
    uses: ./.github/workflows/_agent-cost-tracker-template.yml
    permissions:
      pull-requests: write
      issues: write
      actions: read
