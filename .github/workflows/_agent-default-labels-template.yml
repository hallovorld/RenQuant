name: agent-default-labels-template
# Reusable workflow that auto-adds `agent:fix:<name>` executor-permission
# labels when an authorship label (`agent:claude` / `agent:codex`) is
# present on a PR.
#
# Why: per `doc/ops/agent-automation.md` §2.1, authorship and
# fix-executor permission are intentionally split. Authorship is set by
# the agent that opens the PR (G1); fix-executor permission is a separate
# `agent:fix:<name>` label that gates G3 auto-fix per-agent. Without that
# second label, G3 skips silently — which is exactly the v1 gap
# `agent-automation-v2-design.md §3.2` calls out.
#
# Behavior:
#   - On PR open / label / synchronize, inspect labels.
#   - If `agent:claude` or `agent:codex` is present, ensure BOTH
#     `agent:fix:claude` AND `agent:fix:codex` are present (cross-agent
#     fix invitation is the default per the v2 design; operator removes
#     one to opt out for a specific PR).
#   - Idempotent: never replaces existing labels; only adds missing.
#   - No-op for human PRs (no authorship label).
#
# Per-repo wrapper invokes:
#
#   jobs:
#     default-labels:
#       uses: hallovorld/RenQuant/.github/workflows/_agent-default-labels-template.yml@main

on:
  workflow_call:
    inputs:
      # Future expansion: per-repo override of which fix-executor labels
      # to ensure. Today the canonical pair is {claude, codex}; if a new
      # agent joins the canon, update this default.
      fix_executors:
        type: string
        required: false
        default: "claude,codex"
        description: "Comma-separated list of agent names to ensure agent:fix:<name> labels for."

permissions:
  pull-requests: write   # label mutation
  issues: write          # PR labels are issue labels

jobs:
  ensure-fix-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure agent:fix:<name> labels match authorship
        env:
          GH_TOKEN: ${{ github.token }}
          # All event fields go through env: per shell-injection-safe
          # convention from `_agent-fix-template.yml`.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          FIX_EXECUTORS: ${{ inputs.fix_executors }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Authorship gate: only act on PRs that carry an agent:* label.
          # Human PRs (no authorship) are out of scope — they go through
          # whatever review flow the repo has.
          if ! echo "$LABELS_JSON" | grep -qE '"agent:(claude|codex)"'; then
            echo "no authorship label on PR #$PR_NUMBER; skipping"
            exit 0
          fi
          # Universal opt-out — operator added agent:manual-hold means
          # all agent automation is paused.
          if echo "$LABELS_JSON" | grep -q '"agent:manual-hold"'; then
            echo "agent:manual-hold present; skipping label management"
            exit 0
          fi
          # Per-agent opt-out: a "no-fix:<name>" label tells us NOT to
          # auto-add that executor's label. Operator escape valve when
          # they want to ban a specific agent from G3 on this PR.
          missing=()
          IFS=',' read -ra EXECUTORS <<< "$FIX_EXECUTORS"
          for agent in "${EXECUTORS[@]}"; do
            agent="$(echo "$agent" | tr -d '[:space:]')"
            [ -z "$agent" ] && continue
            target_label="agent:fix:${agent}"
            optout_label="no-fix:${agent}"
            if echo "$LABELS_JSON" | grep -q "\"${target_label}\""; then
              echo "$target_label already present"
              continue
            fi
            if echo "$LABELS_JSON" | grep -q "\"${optout_label}\""; then
              echo "$optout_label opt-out present; not adding $target_label"
              continue
            fi
            missing+=("$target_label")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "all required agent:fix:* labels already present"
            exit 0
          fi
          # gh pr edit --add-label accepts comma-separated names.
          JOINED=$(IFS=','; echo "${missing[*]}")
          echo "adding: $JOINED"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$JOINED"
