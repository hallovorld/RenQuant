name: agent-default-labels-template
# Reusable workflow that auto-adds an `agent:fix:<name>` executor-permission
# label that matches the PR's authorship.
#
# Why: per `doc/ops/agent-automation.md` §2.1, authorship and
# fix-executor permission are intentionally split. Authorship is set by
# the agent that opens the PR (G1); fix-executor permission is a separate
# `agent:fix:<name>` label that gates G3 auto-fix per-agent. Without that
# second label, G3 skips silently — which is exactly the v1 gap
# `agent-automation-v2-design.md §3.2` calls out.
#
# Behavior:
#   - On PR open / label / synchronize, fetch the PR's current labels
#     LIVE via `gh pr view --json labels` (NEVER trust the event payload,
#     which is stale when labels arrive in a subsequent labeled event
#     after `opened` — codex #168 HIGH-1).
#   - If `agent:claude` or `agent:codex` is present, ensure ONLY the
#     matching `agent:fix:<authorship>` label is auto-added. Cross-agent
#     fix invitation is an EXPLICIT operator action (add the other
#     `agent:fix:<peer>` label by hand) — automatic dual-labelling
#     races two G3 workers on the same head force-push (codex #168
#     HIGH-3).
#   - Idempotent: never replaces existing labels; only adds the
#     matching one if missing.
#   - No-op for human PRs (no authorship label).
#
# Per-repo wrapper invokes:
#
#   jobs:
#     default-labels:
#       uses: hallovorld/RenQuant/.github/workflows/_agent-default-labels-template.yml@main

on:
  workflow_call:
    inputs:
      # Map of authorship label → matching fix-executor name. Default
      # is the canonical {claude, codex} pair. Override per-repo if a
      # new agent joins the canon.
      authorship_to_executor:
        type: string
        required: false
        default: '{"agent:claude":"claude","agent:codex":"codex"}'
        description: "JSON map from authorship label to its matching agent:fix:<name>."

permissions:
  pull-requests: write   # label mutation
  issues: write          # PR labels are issue labels

jobs:
  ensure-fix-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure agent:fix:<authorship> label matches authorship (live fetch)
        env:
          GH_TOKEN: ${{ github.token }}
          # All event fields go through env: per shell-injection-safe
          # convention from `_agent-fix-template.yml`.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MAPPING: ${{ inputs.authorship_to_executor }}
        run: |
          set -euo pipefail
          # HIGH-1 (codex #168): fetch labels live. The opened/labeled
          # event payload can be stale when a label arrives in a
          # subsequent labeled event right after opened — the workflow
          # then reads `labels: []` and skips. Live-fetch sidesteps
          # the race entirely.
          gh pr view "$PR_NUMBER" --repo "$REPO" --json labels > pr.json
          LABELS_JSON=$(jq -c '[.labels[].name]' pr.json)
          echo "live labels: $LABELS_JSON"

          # Authorship gate: only act on PRs that carry an agent:* label.
          # Human PRs (no authorship) are out of scope — they go through
          # whatever review flow the repo has.
          if ! echo "$LABELS_JSON" | grep -qE '"agent:(claude|codex)"'; then
            echo "no authorship label on PR #$PR_NUMBER; skipping"
            exit 0
          fi
          # Universal opt-out — operator added agent:manual-hold means
          # all agent automation is paused.
          if echo "$LABELS_JSON" | grep -q '"agent:manual-hold"'; then
            echo "agent:manual-hold present; skipping label management"
            exit 0
          fi
          # HIGH-3 (codex #168): match the SINGLE authorship to its
          # matching agent:fix:<name>. Cross-agent invitation
          # (adding the peer's agent:fix:<peer> label) becomes an
          # explicit operator action; dual-labelling at this layer
          # automatically races two G3 workers on the same head
          # force-push when a CHANGES_REQUESTED review fires.
          executor=""
          authorship=""
          while IFS= read -r entry; do
            label=$(jq -r '.key'   <<< "$entry")
            exec_name=$(jq -r '.value' <<< "$entry")
            if echo "$LABELS_JSON" | grep -q "\"${label}\""; then
              executor="$exec_name"
              authorship="$label"
              break
            fi
          done < <(jq -c 'to_entries[]' <<< "$MAPPING")
          if [ -z "$executor" ]; then
            echo "authorship label present but not in mapping; skipping"
            exit 0
          fi
          target_label="agent:fix:${executor}"
          optout_label="no-fix:${executor}"
          if echo "$LABELS_JSON" | grep -q "\"${target_label}\""; then
            echo "$target_label already present"
            exit 0
          fi
          if echo "$LABELS_JSON" | grep -q "\"${optout_label}\""; then
            echo "$optout_label opt-out present; not adding $target_label"
            exit 0
          fi
          echo "authorship=$authorship -> adding $target_label"
          # Auto-create the label if the repo doesn't have it yet.
          # `gh pr edit --add-label` errors when the label is unknown,
          # which would falsely fail the workflow on a fresh repo.
          # `gh label create --force` is idempotent.
          if ! gh label list --repo "$REPO" --search "$target_label" --json name --jq '.[].name' | grep -qx "$target_label"; then
            echo "label $target_label does not exist; creating"
            gh label create "$target_label" --repo "$REPO" \
              --color "C2E0C6" \
              --description "Auto-fix executor permission for agent ${executor}" \
              --force
          fi
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$target_label"
