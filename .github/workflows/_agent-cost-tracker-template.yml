name: agent-cost-tracker-template
# Per-PR LLM cost tracking + cap per
# `doc/ops/agent-automation-v2-design.md §3.8`.
#
# Triggers on `workflow_run:completed` for `agent-review` and
# `agent-autofix`. For each completed agent run associated with a PR,
# estimates the spend (model + duration heuristic), increments the
# per-PR `agent-spend-cents:<N>` label, and adds `agent:cost-cap` once
# the threshold is hit. The Phase A/B/C templates already skip when
# `agent:cost-cap` is present.
#
# Cost estimation is necessarily approximate — the actions don't
# expose token counts. We use:
#   model + run_minutes → cents
#
# Default rough estimate (calibrated to the design's §6 envelope):
#   claude-sonnet-4-6   ~5 cents/min  (G2 review)
#   claude-opus-4-7    ~25 cents/min  (G3 fix)
#   gpt-5-codex        ~10 cents/min  (G2 + G3)
#
# Override per-repo via repo variable `AGENT_COST_PER_MIN_CENTS_<MODEL>`
# if real spend diverges. `AGENT_COST_CAP_CENTS` (default 500 = $5)
# is the per-PR ceiling.
#
# IMPORTANT: this template re-reads the LATEST `agent-spend-cents:*`
# label every fire (not the event-payload labels, which can lag), so
# concurrent G2 + G3 runs increment correctly even when the
# `workflow_run` events land out of order.
#
# Per-repo wrapper invokes:
#
#   jobs:
#     track:
#       uses: hallovorld/RenQuant/.github/workflows/_agent-cost-tracker-template.yml@main

on:
  workflow_call:
    inputs:
      cost_cap_cents:
        type: number
        required: false
        default: 500
        description: "Per-PR LLM spend ceiling in cents. Default 500 = $5. Override via repo variable AGENT_COST_CAP_CENTS."
      cost_per_min_claude_sonnet:
        type: number
        required: false
        default: 5
      cost_per_min_claude_opus:
        type: number
        required: false
        default: 25
      cost_per_min_codex:
        type: number
        required: false
        default: 10

permissions:
  pull-requests: write   # label mutation
  issues: write          # PR comments + labels
  actions: read          # read sibling workflow run metadata

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # workflow_run carries `event.workflow_run.pull_requests` only when
    # the triggering workflow was attached to a PR via standard
    # `pull_request` event. For `pull_request_review` and
    # `issue_comment` triggers (G3), we must look up the PR from the
    # head_branch instead.
    steps:
      - name: Resolve PR from triggering workflow_run
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # All workflow_run fields go through env: per shell-safe
          # convention (run name + branch could in theory be injected).
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR_NUMBERS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          # Skip when the trigger workflow didn't actually run anything
          # billable (e.g. cancelled before reaching the action step).
          if [ "$TRIGGER_CONCLUSION" = "skipped" ] || [ "$TRIGGER_CONCLUSION" = "cancelled" ]; then
            echo "trigger conclusion $TRIGGER_CONCLUSION; nothing to bill"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Primary: pull_requests array from the workflow_run payload.
          PR_NUMBER=$(jq -r '.[0].number // empty' <<< "$PR_NUMBERS_JSON")
          if [ -z "$PR_NUMBER" ]; then
            # Fallback: find an open PR with this head branch in the
            # same repo. covers issue_comment / pull_request_review
            # triggers where the workflow_run.pull_requests array is
            # empty.
            PR_NUMBER=$(gh pr list --repo "$REPO" --head "$TRIGGER_HEAD_BRANCH" \
              --state open --json number --jq '.[0].number // empty')
            if [ -z "$PR_NUMBER" ]; then
              echo "no PR found for branch $TRIGGER_HEAD_BRANCH; skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "trigger: $TRIGGER_NAME  pr: #$PR_NUMBER  branch: $TRIGGER_HEAD_BRANCH"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "trigger_run_id=$TRIGGER_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "trigger_name=$TRIGGER_NAME" >> "$GITHUB_OUTPUT"

      - name: Estimate spend in cents
        id: spend
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ steps.pr.outputs.trigger_run_id }}
          COST_PER_MIN_SONNET: ${{ inputs.cost_per_min_claude_sonnet }}
          COST_PER_MIN_OPUS: ${{ inputs.cost_per_min_claude_opus }}
          COST_PER_MIN_CODEX: ${{ inputs.cost_per_min_codex }}
        run: |
          set -euo pipefail
          # Pull duration + job names from the triggering run. Sum
          # per-job runtime against per-model cents/min.
          gh api "repos/${REPO}/actions/runs/${TRIGGER_RUN_ID}/jobs" \
            --jq '.jobs[] | {name, started_at, completed_at}' > jobs.jsonl
          TOTAL_CENTS=0
          while IFS= read -r row; do
            JOB_NAME=$(jq -r .name <<< "$row")
            START=$(jq -r .started_at <<< "$row")
            END=$(jq -r .completed_at <<< "$row")
            if [ -z "$START" ] || [ -z "$END" ] || [ "$START" = "null" ] || [ "$END" = "null" ]; then
              continue
            fi
            START_EPOCH=$(date -u -d "$START" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$START" +%s 2>/dev/null || echo 0)
            END_EPOCH=$(date -u -d "$END" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$END" +%s 2>/dev/null || echo 0)
            MINS=$(( (END_EPOCH - START_EPOCH + 30) / 60 ))   # round to nearest minute
            [ "$MINS" -le 0 ] && MINS=1                       # min 1 minute charge
            # Pick the per-min rate based on job name. claude-fix uses
            # opus (most capable); claude-review uses sonnet (cheaper);
            # codex uses gpt-5-codex.
            case "$JOB_NAME" in
              *claude-fix*|*claude-autofix*)   RATE=$COST_PER_MIN_OPUS  ;;
              *claude-review*|*claude*review*) RATE=$COST_PER_MIN_SONNET ;;
              *codex*)                          RATE=$COST_PER_MIN_CODEX ;;
              *)                                RATE=0 ;;
            esac
            CENTS=$(( MINS * RATE ))
            TOTAL_CENTS=$(( TOTAL_CENTS + CENTS ))
            echo "  $JOB_NAME: $MINS min × $RATE c/min = $CENTS cents"
          done < <(jq -c . jobs.jsonl)
          echo "estimated spend for this run: $TOTAL_CENTS cents"
          echo "run_cents=$TOTAL_CENTS" >> "$GITHUB_OUTPUT"

      - name: Update per-PR running total + cap label
        if: steps.pr.outputs.skip != 'true' && steps.spend.outputs.run_cents != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          RUN_CENTS: ${{ steps.spend.outputs.run_cents }}
          COST_CAP_CENTS: ${{ inputs.cost_cap_cents }}
        run: |
          set -euo pipefail
          # Pull current labels; find existing agent-spend-cents:<N>.
          # Re-read live (don't trust event payload labels — workflow_run
          # events lag and can ship stale labels).
          gh pr view "$PR_NUMBER" --repo "$REPO" --json labels > pr.json
          CURRENT=$(jq -r '.labels[].name | select(startswith("agent-spend-cents:"))' pr.json | head -1)
          PRIOR_CENTS=0
          if [ -n "$CURRENT" ]; then
            PRIOR_CENTS=${CURRENT#agent-spend-cents:}
          fi
          NEW_CENTS=$(( PRIOR_CENTS + RUN_CENTS ))
          echo "PR #$PR_NUMBER  prior=$PRIOR_CENTS + this_run=$RUN_CENTS = $NEW_CENTS cents (cap=$COST_CAP_CENTS)"

          # Repo-variable override (per-repo policy can raise the cap
          # before triggering one-off expensive reviews).
          REPO_CAP=$(gh api "repos/${REPO}/actions/variables/AGENT_COST_CAP_CENTS" \
            -q .value 2>/dev/null || echo "")
          if [ -n "$REPO_CAP" ]; then
            COST_CAP_CENTS="$REPO_CAP"
            echo "repo variable AGENT_COST_CAP_CENTS=$REPO_CAP overrides default"
          fi

          # Auto-create the running-total label idempotently.
          NEW_LABEL="agent-spend-cents:${NEW_CENTS}"
          if ! gh label list --repo "$REPO" --search "$NEW_LABEL" \
                --json name --jq '.[].name' | grep -qx "$NEW_LABEL"; then
            gh label create "$NEW_LABEL" --repo "$REPO" \
              --color "BFD4F2" \
              --description "Running per-PR LLM spend estimate (cents)" \
              --force
          fi
          # Remove the old running-total label, add the new.
          if [ -n "$CURRENT" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$CURRENT" 2>/dev/null || true
          fi
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$NEW_LABEL"

          # If over cap, add the universal-stop label (Phase A/B/C
          # workflows already skip on agent:cost-cap).
          if [ "$NEW_CENTS" -ge "$COST_CAP_CENTS" ]; then
            if ! gh label list --repo "$REPO" --search "agent:cost-cap" \
                  --json name --jq '.[].name' | grep -qx "agent:cost-cap"; then
              gh label create "agent:cost-cap" --repo "$REPO" \
                --color "B60205" \
                --description "Per-PR LLM spend cap reached (Phase D)" \
                --force
            fi
            if ! jq -r '.labels[].name' pr.json | grep -qx "agent:cost-cap"; then
              gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "agent:cost-cap"
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<EOF
              ⛔ \`agent-cost-tracker\`: estimated per-PR LLM spend reached \`${NEW_CENTS} cents\` (cap \`${COST_CAP_CENTS}\`). Label \`agent:cost-cap\` added.

              All v2 agent workflows (G2 review, G3 auto-fix, classifier) will now skip on this PR. The \`evaluate\` (auto-merge) gate also treats this as a hard stop (G-A3).

              To resume:
              - Remove the \`agent:cost-cap\` label (manual override; spend continues to accrue).
              - OR raise the per-PR cap with \`gh variable set AGENT_COST_CAP_CENTS --body "<higher>" --repo ${REPO}\` and remove the label.
              EOF
              )"
            fi
          fi
