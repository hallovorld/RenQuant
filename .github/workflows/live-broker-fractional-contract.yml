name: live-broker-fractional-contract

# The fractional capability gate (adapters/commit_contract.py) probes the LIVE
# broker object for `is_fractionable` + a no-submit classifier. This workflow
# pins that the REAL live.alpaca_broker.AlpacaBroker satisfies leg (a) — a
# structural test that no other workflow collects (every umbrella workflow
# names its test files explicitly; an unnamed new file is a green check that
# covered nothing). No network, no credentials: the alpaca SDK is imported
# lazily inside methods and the tests stub the asset lookup.
#
# Step 2 of the fractional chain adds tests/test_live_broker_no_silent_truncation.py:
# the live order paths never truncate a quantity (whole-share payloads
# byte-identical; fractional intents refused or submitted exactly). Same job,
# same lean environment — the SDK request/enum modules are stubbed, so the
# runner end-to-end cases (which need the strategy deps) skip HERE and run in
# the full local suite; the static pins of the runner handling sites run here.
#
# Step 3 (orch#1078 follow-up) adds tests/test_software_stops_neutral_root.py:
# the software-stop registry is resolved under the NEUTRAL runtime-state root
# (adapters/software_stops_wiring.py; fail-closed when the orchestrator
# LOCATION contract is unimportable — never the cwd) and
# scripts/intraday_sell_104.sh seeds that registry unconditionally BEFORE the
# runner without ever exiting on a seed failure. The wiring module has no
# heavy imports and the sibling modules are stubbed when absent, so the
# behavioural cases run here; only the RunnerAdapter.__init__ end-to-end case
# skips here and runs in the full local suite.

on:
  pull_request:
    paths:
      - "live/**"
      - "backtesting/renquant_104/adapters/commit_contract.py"
      - "backtesting/renquant_104/adapters/runner.py"
      - "backtesting/renquant_104/adapters/software_stops_wiring.py"
      - "scripts/intraday_sell_104.sh"
      - "tests/test_live_broker_fractional_contract.py"
      - "tests/test_live_broker_no_silent_truncation.py"
      - "tests/test_software_stops_neutral_root.py"
      - ".github/workflows/live-broker-fractional-contract.yml"
  push:
    branches: [main]
    paths:
      - "live/**"
      - "backtesting/renquant_104/adapters/commit_contract.py"
      - "backtesting/renquant_104/adapters/runner.py"
      - "backtesting/renquant_104/adapters/software_stops_wiring.py"
      - "scripts/intraday_sell_104.sh"
      - "tests/test_live_broker_fractional_contract.py"
      - "tests/test_live_broker_no_silent_truncation.py"
      - "tests/test_software_stops_neutral_root.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test tools
        run: python3 -m pip install pytest
      - name: Live broker satisfies fractional gate leg (a) (must run, not skip)
        run: |
          set -euo pipefail
          python3 -m pytest -q -o addopts='' tests/test_live_broker_fractional_contract.py -v
      - name: Live broker never silently truncates a quantity (step 2)
        run: |
          set -euo pipefail
          python3 -m pytest -q -o addopts='' tests/test_live_broker_no_silent_truncation.py -v
      - name: Software-stop registry at the neutral root; sell wrapper seeds before the runner (step 3)
        run: |
          set -euo pipefail
          python3 -m pytest -q -o addopts='' tests/test_software_stops_neutral_root.py -v
