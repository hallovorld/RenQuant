name: live-broker-fractional-contract

# The fractional capability gate (adapters/commit_contract.py) probes the LIVE
# broker object for `is_fractionable` + a no-submit classifier. This workflow
# pins that the REAL live.alpaca_broker.AlpacaBroker satisfies leg (a) — a
# structural test that no other workflow collects (every umbrella workflow
# names its test files explicitly; an unnamed new file is a green check that
# covered nothing). No network, no credentials: the alpaca SDK is imported
# lazily inside methods and the tests stub the asset lookup.
#
# Step 2 of the fractional chain adds tests/test_live_broker_no_silent_truncation.py:
# the live order paths never truncate a quantity (whole-share payloads
# byte-identical; fractional intents refused or submitted exactly). Same job,
# same lean environment — the SDK request/enum modules are stubbed, so the
# runner end-to-end cases (which need the strategy deps) skip HERE and run in
# the full local suite; the static pins of the runner handling sites run here.
#
# Step 3 (orch#1078 follow-up) adds tests/test_software_stops_neutral_root.py:
# with execution.software_stops disabled/absent the wiring returns None before
# importing, resolving, logging or touching anything (the pipeline-owned gate
# is read first); when enabled the registry is resolved under the NEUTRAL
# runtime-state root (adapters/software_stops_wiring.py; fail-closed when the
# orchestrator LOCATION contract is unimportable — never the cwd) and
# scripts/intraday_sell_104.sh seeds that registry unconditionally BEFORE the
# runner without ever exiting on a seed failure. The wiring module has no
# heavy imports and the sibling modules are stubbed when absent, so the
# gate/inertness/fail-closed/wrapper cases run here; the RunnerAdapter.__init__
# end-to-end cases and the assembly-level pinned-seeder cases (they need the
# strategy deps / the runtime assembly) skip here WITH a reason and run in the
# full local suite beside the pinned checkouts.
#
# Step 4 (RenQuant#618 class C) adds tests/test_fill_replay_rq618.py plus the
# two runner_tax_lots suites: the live fill replay never drops a price-less
# fill (a price-less SELL reduces lots; a price-less BUY is applied with a
# flagged basis; counts surface in the LIVE-TAX-LOTS lines) and
# get_filled_orders' pagination never duplicates the boundary order (cursor
# = oldest − 1µs AND id dedupe). kernel.exits is self-contained and the SDK
# request/enum modules are stubbed, so every case runs here.
#
# Step 5 (fix/size-on-settled-cash, 2026-08-30) adds
# tests/test_buy_sizing_settled_cash.py: buys are sized on SETTLED cash by
# default (account.cash floored at 0 — never unsettled proceeds, never
# margin); execution.buying_power_mode is READ and honoured (settled_cash |
# non_marginable_buying_power | buying_power); the runner logs cash/nmbp/mode
# every read; same-bar sell proceeds are not credited under settled sizing;
# the vocabulary equals the sim's. live.broker / live.alpaca_broker /
# adapters.runner_execmath import nothing heavy, so every case runs here.

on:
  pull_request:
    paths:
      - "backtesting/renquant_104/adapters/runner_execmath.py"
      - "tests/test_buy_sizing_settled_cash.py"
      - "live/**"
      - "backtesting/renquant_104/adapters/commit_contract.py"
      - "backtesting/renquant_104/adapters/runner.py"
      - "backtesting/renquant_104/adapters/software_stops_wiring.py"
      - "scripts/intraday_sell_104.sh"
      - "tests/test_live_broker_fractional_contract.py"
      - "tests/test_live_broker_no_silent_truncation.py"
      - "tests/test_software_stops_neutral_root.py"
      - "backtesting/renquant_104/adapters/runner_tax_lots.py"
      - "backtesting/renquant_104/kernel/exits.py"
      - "tests/test_fill_replay_rq618.py"
      - "tests/test_runner_tax_lots.py"
      - "tests/test_runner_tax_lots_invariants.py"
      - ".github/workflows/live-broker-fractional-contract.yml"
  push:
    branches: [main]
    paths:
      - "backtesting/renquant_104/adapters/runner_execmath.py"
      - "tests/test_buy_sizing_settled_cash.py"
      - "live/**"
      - "backtesting/renquant_104/adapters/commit_contract.py"
      - "backtesting/renquant_104/adapters/runner.py"
      - "backtesting/renquant_104/adapters/software_stops_wiring.py"
      - "scripts/intraday_sell_104.sh"
      - "tests/test_live_broker_fractional_contract.py"
      - "tests/test_live_broker_no_silent_truncation.py"
      - "tests/test_software_stops_neutral_root.py"
      - "backtesting/renquant_104/adapters/runner_tax_lots.py"
      - "backtesting/renquant_104/kernel/exits.py"
      - "tests/test_fill_replay_rq618.py"
      - "tests/test_runner_tax_lots.py"
      - "tests/test_runner_tax_lots_invariants.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test tools
        run: python3 -m pip install pytest
      - name: Live broker satisfies fractional gate leg (a) (must run, not skip)
        run: |
          set -euo pipefail
          python3 -m pytest -q -o addopts='' tests/test_live_broker_fractional_contract.py -v
      - name: Live broker never silently truncates a quantity (step 2)
        run: |
          set -euo pipefail
          python3 -m pytest -q -o addopts='' tests/test_live_broker_no_silent_truncation.py -v
      - name: Software-stop registry at the neutral root; sell wrapper seeds before the runner (step 3)
        run: |
          set -euo pipefail
          python3 -m pytest -q -o addopts='' tests/test_software_stops_neutral_root.py -v
      - name: Fill replay never drops price-less fills; pagination boundary never duplicated (step 4, RQ#618 class C)
        run: |
          set -euo pipefail
          python3 -m pytest -q -o addopts='' \
            tests/test_fill_replay_rq618.py \
            tests/test_runner_tax_lots.py \
            tests/test_runner_tax_lots_invariants.py -v
      - name: Buys are sized on settled cash; buying_power_mode honoured (step 5)
        run: |
          set -euo pipefail
          python3 -m pytest -q -o addopts='' tests/test_buy_sizing_settled_cash.py -v
