name: agent-pre-merge-rebase-template
# Server-side enforcement of CLAUDE.md §3.2 sync mandate — rebases the
# PR head onto the latest base before the auto-merge gate evaluates.
# Without this, an APPROVE → auto-merge path could land a stale PR
# that hasn't been rebased since another agent's PR merged.
#
# Behavior:
#   - On `pull_request: synchronize` (and `workflow_dispatch` from
#     `agent-auto-merge`), compare PR head to base ref.
#   - If behind by ≥ 1 commit, fetch the base and attempt
#     `git rebase origin/<base>` on the PR head ref.
#   - On clean rebase, `git push --force-with-lease` to the PR head.
#   - On conflict, abort the rebase, add label
#     `agent:rebase-conflict` (which blocks the auto-merge gate per
#     §3.4 / Phase B), and post a PR comment naming the conflicting
#     files. A human must resolve and remove the label.
#
# Why this is its own template (not inline in auto-merge):
#   - It's also useful standalone — operators can manually
#     `workflow_dispatch` it when they see a stale PR.
#   - Auto-merge calls it as a pre-flight; isolation makes the gate
#     logic readable.
#
# IMPORTANT: this template does NOT bypass branch protection. The
# force-with-lease push fails if branch protection requires linear
# history or no force pushes — in that case, the workflow surfaces
# the error and the operator merges manually. Branch protection is
# the ultimate source of truth.
#
# Per-repo wrapper invokes:
#
#   jobs:
#     pre-merge-rebase:
#       uses: hallovorld/RenQuant/.github/workflows/_agent-pre-merge-rebase-template.yml@main
#       secrets:
#         git_push_token: ${{ secrets.AGENT_GIT_PUSH_TOKEN }}

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
        default: ""
        description: "Explicit PR number to rebase. Defaults to event PR. Used by auto-merge to dispatch this template against a specific PR."
    secrets:
      git_push_token:
        required: false
        description: "PAT or GitHub App token with contents:write scoped to this repo. Falls back to github.token when absent (then branch protection may block the force-push)."

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve PR + base context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPLICIT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Choose explicit input over event payload — auto-merge
          # dispatches us with the PR number it's gating.
          if [ -n "$EXPLICIT_PR" ]; then
            PR_NUMBER="$EXPLICIT_PR"
          elif [ -n "$EVENT_PR" ]; then
            PR_NUMBER="$EVENT_PR"
          else
            echo "::error::no PR number from input or event payload"
            exit 1
          fi
          # Live-fetch PR state (labels race fix from Phase A is still
          # relevant here — event payload may be stale by the time the
          # rebase runs).
          gh pr view "$PR_NUMBER" --repo "$REPO" --json \
            number,labels,headRefName,headRefOid,baseRefName,baseRefOid,isDraft,state,mergeable \
            > pr.json
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_ref=$(jq -r .headRefName pr.json)"
            echo "head_sha=$(jq -r .headRefOid pr.json)"
            echo "base_ref=$(jq -r .baseRefName pr.json)"
            echo "base_sha=$(jq -r .baseRefOid pr.json)"
            echo "state=$(jq -r .state pr.json)"
            echo "labels=$(jq -c '[.labels[].name]' pr.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Gate on labels + PR state
        id: gate
        env:
          STATE: ${{ steps.ctx.outputs.state }}
          LABELS: ${{ steps.ctx.outputs.labels }}
        run: |
          set -euo pipefail
          if [ "$STATE" != "OPEN" ]; then
            echo "PR not OPEN (state=$STATE); skipping rebase"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$LABELS" | grep -q '"agent:manual-hold"'; then
            echo "agent:manual-hold present; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$LABELS" | grep -q '"agent:rebase-conflict"'; then
            echo "agent:rebase-conflict already present; needs human resolution"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ctx.outputs.head_ref }}
          token: ${{ secrets.git_push_token || github.token }}

      - name: Check if behind base
        if: steps.gate.outputs.run == 'true'
        id: behind
        env:
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=200
          BEHIND=$(git rev-list --count "HEAD..origin/$BASE_REF")
          AHEAD=$(git rev-list --count "origin/$BASE_REF..HEAD")
          echo "ahead=$AHEAD behind=$BEHIND"
          if [ "$BEHIND" -eq 0 ]; then
            echo "PR is up to date with origin/$BASE_REF; nothing to rebase"
            echo "needs_rebase=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rebase=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase + push
        if: steps.gate.outputs.run == 'true' && steps.behind.outputs.needs_rebase == 'true'
        id: rebase
        env:
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
          HEAD_REF: ${{ steps.ctx.outputs.head_ref }}
          AGENT_BOT_NAME: "rebase-bot"
        run: |
          set -uo pipefail
          # Identity for the rebase commit metadata (rebase preserves
          # author trailers; this is just the committer for the
          # rewritten chain).
          git config user.name "rebase-bot"
          git config user.email "noreply@github.com"
          # Attempt the rebase. On conflict, abort and surface to the
          # next step which will label + comment.
          if git rebase "origin/$BASE_REF"; then
            echo "rebase clean; force-pushing"
            git push --force-with-lease origin "HEAD:$HEAD_REF"
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            # Capture which files conflicted before aborting.
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git rebase --abort || true
            echo "conflicts=$CONFLICTS" >> "$GITHUB_OUTPUT"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Label + comment on conflict
        if: |
          steps.gate.outputs.run == 'true' &&
          steps.behind.outputs.needs_rebase == 'true' &&
          steps.rebase.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          CONFLICTS: ${{ steps.rebase.outputs.conflicts }}
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
        run: |
          set -euo pipefail
          # Auto-create the label idempotently (Phase A taught us this).
          if ! gh label list --repo "$REPO" --search "agent:rebase-conflict" \
                --json name --jq '.[].name' | grep -qx "agent:rebase-conflict"; then
            gh label create "agent:rebase-conflict" --repo "$REPO" \
              --color "B60205" \
              --description "Auto-rebase failed; human resolution required before auto-merge" \
              --force
          fi
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "agent:rebase-conflict"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<EOF
          🔒 \`agent-pre-merge-rebase\`: rebase onto \`origin/${BASE_REF}\` failed with conflicts in:

          \`\`\`
          ${CONFLICTS}
          \`\`\`

          Label \`agent:rebase-conflict\` added — Phase B auto-merge will skip this PR until the label is removed.

          To resolve:

          1. Pull this branch locally.
          2. \`git fetch origin && git rebase origin/${BASE_REF}\`
          3. Resolve the conflicts in the listed files.
          4. \`git push --force-with-lease\`.
          5. Remove the \`agent:rebase-conflict\` label.
          EOF
          )"
