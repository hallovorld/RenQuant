name: agent-review
# Auto-review every non-self PR via Claude AND Codex.
# Wraps RenQuant umbrella's reusable G2 template per
# doc/ops/agent-automation.md §3.1 + §4.2.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths-ignore here: branch protection requires the review jobs to
    # emit a status on every PR. If this workflow is path-skipped, GitHub
    # has no review status to require and PRs can merge without review.

concurrency:
  # MANDATORY: only review the latest commit when a PR is pushed
  # in quick succession — older runs cancel.
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # MANDATORY size gate: skip mega-PRs (human-only review territory).
    if: github.event.pull_request.changed_files < 100
    uses: ./.github/workflows/_agent-review-template.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Required by claude-code-action@v1 and codex-action@v1 to fetch
      # an OIDC token during action setup (see
      # `_agent-review-template.yml` line note + 2026-06-03 incident
      # log: "Could not fetch an OIDC token. Did you remember to add
      # `id-token: write` to your workflow permissions?"). Caller MUST
      # grant this; the reusable template can't claim it on its own.
      id-token: write
    with:
      agent: claude
      model: claude-sonnet-4-6
    secrets:
      api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  codex-review:
    if: github.event.pull_request.changed_files < 100
    uses: ./.github/workflows/_agent-review-template.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Required by claude-code-action@v1 and codex-action@v1 to fetch
      # an OIDC token during action setup (see
      # `_agent-review-template.yml` line note + 2026-06-03 incident
      # log: "Could not fetch an OIDC token. Did you remember to add
      # `id-token: write` to your workflow permissions?"). Caller MUST
      # grant this; the reusable template can't claim it on its own.
      id-token: write
    with:
      agent: codex
      model: gpt-5-codex
    secrets:
      api_key: ${{ secrets.OPENAI_API_KEY }}
