name: agent-default-labels
# Auto-adds agent:fix:<name> executor-permission labels when an
# authorship label is present, so G3 auto-fix gate doesn't silently
# skip on agent-authored PRs that forgot the executor opt-in.
#
# Wraps `_agent-default-labels-template.yml` per
# `doc/ops/agent-automation-v2-design.md §3.2`.

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]

# Two concurrent runs would both call `gh pr edit --add-label`
# idempotently, so cancel-in-progress is safe here. We do cancel to
# avoid stacking long queues when an operator rapidly relabels.
concurrency:
  group: agent-default-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ensure-fix-labels:
    uses: ./.github/workflows/_agent-default-labels-template.yml
    permissions:
      pull-requests: write
      issues: write
