name: audit-regression-suites

# The 2026-04-24 and 2026-04-25 audit suites had FOUR failing assertions that
# nobody knew about, because no workflow named their files (orch#1022).
#
# None of the four was a regression. Each was a stale LOCATOR, and each rotted
# differently, which is the part worth keeping in view:
#
#   * a substring searched inside a hand-tuned byte window — bumped 4k -> 8k ->
#     10k across three previous repairs — until the function grew past it again;
#   * `src.find("class ApplyNGBoostTask")` returning -1 after the class moved to
#     another module, so `src[idx:]` became `src[-1:]`: the assertion ran against
#     a haystack of ONE CHARACTER, and could only fail, never explain;
#   * a literal that moved into an extracted helper, leaving the caller correct
#     and the assertion looking at the wrong function;
#   * an assertion at the wrong LAYER — the gate task now latches a flag that the
#     job boundary applies, so testing the task alone reported "buys not blocked"
#     for a pipeline that blocks them correctly.
#
# They are repaired to assert STRUCTURE and BEHAVIOUR, with a missing target
# raising `TargetNotFound` instead of silently searching nothing. This workflow
# is the other half: an assertion nobody runs is not a guarantee, however it is
# written.
#
# HERMETIC by construction, matching this repo's other workflows: a bare
# checkout, pytest, no subrepo runtime. Verified in a stripped environment
# (`env -i`) so it cannot quietly start depending on a developer's PYTHONPATH.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: python3 -m pip install pytest
      - name: The audit regression suites must actually run
        run: |
          set -euo pipefail
          python3 -m pytest -q -o addopts='' \
            tests/test_audit_2026_04_24_fixes.py \
            tests/test_round3_audit_fixes_2026_04_25.py
      - name: The probe must fail loudly on a missing target, not silently
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          from pathlib import Path
          from _source_probe import TargetNotFound, find_def, parse
          try:
              find_def(parse(Path("tests/_source_probe.py")), "definitely_not_here",
                       where="_source_probe.py")
          except TargetNotFound:
              print("ok: a missing target raises TargetNotFound")
          else:
              raise SystemExit("the probe returned quietly for a missing target — "
                               "that is the exact vacuity this replaces")
          PY
