name: strategy-104-snapshot-fresh

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated production snapshot is not stale
        run: |
          set -euo pipefail
          python3 scripts/render_strategy_104_snapshot.py --check
