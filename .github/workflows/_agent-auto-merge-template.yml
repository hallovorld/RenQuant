name: agent-auto-merge-template
# 8-gate auto-merge per `doc/ops/agent-automation-v2-design.md §3.4`.
# Fires on `pull_request_review:submitted` with state=APPROVED OR on
# `check_suite:completed` (re-evaluate when CI finishes after an
# already-approved review).
#
# THE 8 GATES (must ALL pass):
#
#   G-A1  PR author has an `agent:*` authorship label (not a human PR)
#   G-A2  PR opt-in: `agent:auto-merge` label OR repo variable
#         `AGENT_AUTO_MERGE_DEFAULT == "true"`
#   G-A3  Universal stop labels absent: `agent:manual-hold`,
#         `agent:rebase-conflict`, `agent:cost-cap` (Phase D)
#   G-A4  Latest head has at least one `APPROVED` review from a
#         registered agent reviewer (Claude or Codex), AND zero
#         `CHANGES_REQUESTED` reviews on the latest head
#   G-A5  All required status checks green (uses
#         `gh pr view --json statusCheckRollup`)
#   G-A6  Branch up to date with base — calls
#         `agent-pre-merge-rebase` via `workflow_dispatch` if not,
#         then re-evaluates this gate after rebase completes
#   G-A7  Paired-PR contract honored: if `paired-mirror` label is
#         present, the sister PR named by `paired:<owner>/<repo>#<n>`
#         label must already be MERGED (else hold). Phase C wires
#         this; v2 Phase B treats absence as pass.
#   G-A8  No outstanding `agent:fix:<X>:attempt-3` retry-exhaustion
#         label — implies repeated fix failures that need human review
#
# All gates fail closed: a misconfigured gate skips the merge rather
# than allowing it.
#
# After all gates pass: `gh pr merge --merge --delete-branch`. The
# `--merge` strategy preserves the PR's commit history (matches
# CLAUDE.md §3.1 example). Operators can override per-PR by setting a
# label `agent:auto-merge:squash` to force squash, but the default is
# merge.

on:
  workflow_call:
    secrets:
      git_push_token:
        required: false
        description: "PAT/App token with contents:write + pull-requests:write. Falls back to github.token."

permissions:
  contents: write     # merge commit creation
  pull-requests: write
  issues: write
  checks: read        # status check rollup
  actions: write      # workflow_dispatch agent-pre-merge-rebase

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two fire paths converge: review APPROVED + check_suite completed.
    # Skip if neither — defense.
    if: |
      (github.event_name == 'pull_request_review' && github.event.review.state == 'APPROVED') ||
      github.event_name == 'check_suite'
    steps:
      - name: Resolve PR context (handles both event shapes)
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # pull_request_review: github.event.pull_request.number
          # check_suite: must look up PRs via pull_requests[]
          PR_NUMBER_REVIEW: ${{ github.event.pull_request.number }}
          CHECK_SUITE_PRS: ${{ toJson(github.event.check_suite.pull_requests) }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            PR_NUMBER="$PR_NUMBER_REVIEW"
          elif [ "$EVENT_NAME" = "check_suite" ]; then
            # check_suite includes an array of attached PRs. Pick the
            # first OPEN one — there should be at most one.
            PR_NUMBER=$(jq -r '.[0].number // empty' <<< "$CHECK_SUITE_PRS")
            if [ -z "$PR_NUMBER" ]; then
              echo "check_suite not attached to any PR; skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            echo "::error::unsupported event $EVENT_NAME"; exit 1
          fi
          gh pr view "$PR_NUMBER" --repo "$REPO" --json \
            number,labels,headRefName,headRefOid,baseRefName,baseRefOid,state,isDraft,author,reviewDecision,statusCheckRollup,mergeStateStatus \
            > pr.json
          {
            echo "skip=false"
            echo "pr_number=$PR_NUMBER"
            echo "labels=$(jq -c '[.labels[].name]' pr.json)"
            echo "head_sha=$(jq -r .headRefOid pr.json)"
            echo "head_ref=$(jq -r .headRefName pr.json)"
            echo "base_ref=$(jq -r .baseRefName pr.json)"
            echo "state=$(jq -r .state pr.json)"
            echo "is_draft=$(jq -r .isDraft pr.json)"
            echo "review_decision=$(jq -r .reviewDecision pr.json)"
            echo "merge_state=$(jq -r .mergeStateStatus pr.json)"
          } >> "$GITHUB_OUTPUT"

      - name: G-A1 — agent authorship label present
        id: g_a1
        if: steps.ctx.outputs.skip != 'true'
        env:
          LABELS: ${{ steps.ctx.outputs.labels }}
          STATE: ${{ steps.ctx.outputs.state }}
          IS_DRAFT: ${{ steps.ctx.outputs.is_draft }}
        run: |
          set -euo pipefail
          if [ "$STATE" != "OPEN" ] || [ "$IS_DRAFT" = "true" ]; then
            echo "PR state=$STATE draft=$IS_DRAFT; not eligible"
            echo "pass=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$LABELS" | grep -qE '"agent:(claude|codex)"'; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "no agent:* authorship; human PRs merge manually"
            echo "pass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: G-A2 — auto-merge opt-in
        id: g_a2
        if: steps.ctx.outputs.skip != 'true' && steps.g_a1.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABELS: ${{ steps.ctx.outputs.labels }}
        run: |
          set -euo pipefail
          # Per-PR label takes priority.
          if echo "$LABELS" | grep -q '"agent:auto-merge"'; then
            echo "per-PR agent:auto-merge present"
            echo "pass=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Repo-level variable. `gh api repos/.../actions/variables/NAME`
          # returns 404 when unset.
          REPO_DEFAULT=$(gh api "repos/${REPO}/actions/variables/AGENT_AUTO_MERGE_DEFAULT" \
            -q .value 2>/dev/null || echo "")
          if [ "$REPO_DEFAULT" = "true" ]; then
            echo "repo default AGENT_AUTO_MERGE_DEFAULT=true"
            echo "pass=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "no auto-merge opt-in (no label, no repo default)"
          echo "pass=false" >> "$GITHUB_OUTPUT"

      - name: G-A3 — universal stop labels absent
        id: g_a3
        if: steps.ctx.outputs.skip != 'true' && steps.g_a2.outputs.pass == 'true'
        env:
          LABELS: ${{ steps.ctx.outputs.labels }}
        run: |
          set -euo pipefail
          for stop in agent:manual-hold agent:rebase-conflict agent:cost-cap; do
            if echo "$LABELS" | grep -q "\"${stop}\""; then
              echo "stop label present: $stop"
              echo "pass=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: G-A4 — APPROVED on latest head, zero CHANGES_REQUESTED
        id: g_a4
        if: steps.ctx.outputs.skip != 'true' && steps.g_a3.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Pull all reviews and filter to the latest head SHA only.
          # GitHub's `reviewDecision` aggregates across HEADs which can
          # leak stale CHANGES_REQUESTED from a prior force-push — we
          # want strictly the latest head's reviews.
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --paginate \
            -q '.[] | select(.commit_id == "'"${HEAD_SHA}"'") | {state, user: .user.login}' \
            > reviews.jsonl
          if [ ! -s reviews.jsonl ]; then
            echo "no reviews on latest head $HEAD_SHA"
            echo "pass=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -q '"state":"CHANGES_REQUESTED"' reviews.jsonl; then
            echo "CHANGES_REQUESTED present on latest head"
            echo "pass=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! grep -q '"state":"APPROVED"' reviews.jsonl; then
            echo "no APPROVED on latest head"
            echo "pass=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: G-A5 — required status checks green
        id: g_a5
        if: steps.ctx.outputs.skip != 'true' && steps.g_a4.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          set -euo pipefail
          # `gh pr view --json statusCheckRollup` returns an array of
          # check_runs with conclusion. We require all non-skipped
          # checks to have conclusion SUCCESS.
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json statusCheckRollup \
            -q '.statusCheckRollup[]' > checks.jsonl
          # Pending = not green yet. Failed/cancelled/timed_out = red.
          BAD=$(jq -r 'select(.conclusion != null and .conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL") | .name' checks.jsonl)
          PENDING=$(jq -r 'select(.conclusion == null) | .name' checks.jsonl)
          if [ -n "$BAD" ]; then
            echo "failing checks:"; echo "$BAD"
            echo "pass=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$PENDING" ]; then
            echo "pending checks (waiting):"; echo "$PENDING"
            # Pending != fail — but auto-merge should not fire yet.
            # check_suite:completed will re-trigger when remaining
            # checks finish.
            echo "pass=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: G-A6 — branch up to date with base (dispatch rebase if not)
        id: g_a6
        if: steps.ctx.outputs.skip != 'true' && steps.g_a5.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_STATE: ${{ steps.ctx.outputs.merge_state }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          set -euo pipefail
          # mergeStateStatus values: CLEAN, HAS_HOOKS, UNSTABLE, BEHIND,
          # BLOCKED, DRAFT, DIRTY, UNKNOWN. BEHIND = behind base; we
          # dispatch the rebase workflow and bail this run. The next
          # synchronize event (after rebase pushes) re-enters this gate.
          case "$MERGE_STATE" in
            CLEAN|HAS_HOOKS|UNSTABLE)
              echo "mergeable; merge_state=$MERGE_STATE"
              echo "pass=true" >> "$GITHUB_OUTPUT"
              ;;
            BEHIND)
              echo "PR behind base; dispatching agent-pre-merge-rebase"
              gh workflow run agent-pre-merge-rebase.yml \
                --repo "$REPO" \
                -f pr_number="$PR_NUMBER" || true
              echo "pass=false" >> "$GITHUB_OUTPUT"
              ;;
            DIRTY)
              echo "PR has merge conflicts; cannot auto-merge"
              echo "pass=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "merge_state=$MERGE_STATE; treating as not-ready"
              echo "pass=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: G-A7 — paired-mirror sister merged (Phase C; pass if not labeled)
        id: g_a7
        if: steps.ctx.outputs.skip != 'true' && steps.g_a6.outputs.pass == 'true'
        env:
          LABELS: ${{ steps.ctx.outputs.labels }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Phase B treats this as pass when no paired-mirror label is
          # present. Phase C wires the actual sister-PR-merged check.
          if ! echo "$LABELS" | grep -q '"paired-mirror"'; then
            echo "no paired-mirror label; not in pair contract"
            echo "pass=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Find the paired:<owner>/<repo>#<n> label.
          SISTER=$(echo "$LABELS" | jq -r '.[]' | grep -E '^paired:[^/]+/[^#]+#[0-9]+$' | head -1 || true)
          if [ -z "$SISTER" ]; then
            echo "paired-mirror present but no paired:<sister> label; blocking"
            echo "pass=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Parse paired:owner/repo#N.
          REF=${SISTER#paired:}
          OWNER_REPO=${REF%#*}
          NUM=${REF#*#}
          SISTER_STATE=$(gh api "repos/${OWNER_REPO}/pulls/${NUM}" -q .state 2>/dev/null || echo "")
          SISTER_MERGED=$(gh api "repos/${OWNER_REPO}/pulls/${NUM}" -q .merged 2>/dev/null || echo "false")
          if [ "$SISTER_MERGED" = "true" ]; then
            echo "sister PR ${SISTER} already merged"
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "sister PR ${SISTER} not merged (state=$SISTER_STATE)"
            echo "pass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: G-A8 — no attempt-3 retry exhaustion
        id: g_a8
        if: steps.ctx.outputs.skip != 'true' && steps.g_a7.outputs.pass == 'true'
        env:
          LABELS: ${{ steps.ctx.outputs.labels }}
        run: |
          set -euo pipefail
          if echo "$LABELS" | grep -qE '"agent:fix:(claude|codex):attempt-3"'; then
            echo "attempt-3 label present; G3 has exhausted retries — needs human"
            echo "pass=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: |
          steps.ctx.outputs.skip != 'true' &&
          steps.g_a8.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ secrets.git_push_token || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          LABELS: ${{ steps.ctx.outputs.labels }}
        run: |
          set -euo pipefail
          # Default strategy is --merge (preserves PR commit history,
          # matches CLAUDE.md §3.1 example). agent:auto-merge:squash
          # label opts into --squash.
          if echo "$LABELS" | grep -q '"agent:auto-merge:squash"'; then
            STRATEGY="--squash"
          else
            STRATEGY="--merge"
          fi
          echo "all 8 gates passed; merging PR #${PR_NUMBER} ($STRATEGY)"
          gh pr merge "$PR_NUMBER" --repo "$REPO" $STRATEGY --delete-branch
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<EOF
          🤖 \`agent-auto-merge\`: all 8 gates passed on commit \`${{ steps.ctx.outputs.head_sha }}\`.
          Merged with \`$STRATEGY\`; branch deleted.

          To opt this repo (or specific PRs) out:
          - per-PR: remove the \`agent:auto-merge\` label OR add \`agent:manual-hold\`
          - per-repo: \`gh variable set AGENT_AUTO_MERGE_DEFAULT --body "false" --repo ${REPO}\`
          EOF
          )"
