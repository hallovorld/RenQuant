name: pin-import-integrity

# GOAL-5 AC5 (D1): a candidate pin COMBINATION must serve every aliased
# kernel import the pinned pipeline can lazily reach. Per-repo CI is
# structurally blind to this class (2026-07-16 incident, orchestrator
# #524: both repos green, first daily after the pin sync died at
# MetaLabelVetoTask). This job bootstraps the multirepo runtime against
# the PR's lock and import-checks all aliased-namespace targets.

on:
  pull_request:
    paths:
      - subrepos.lock.json
      - scripts/pin_import_integrity_sweep.py
      - .github/workflows/pin-import-integrity.yml
  push:
    branches: [main]
    paths:
      - subrepos.lock.json

permissions:
  contents: read

jobs:
  import-integrity:
    runs-on: macos-14  # the requirements lock is macOS-native (pyobjc etc.); match its platform
    steps:
      - name: Check out umbrella
        uses: actions/checkout@v4
        with:
          path: umbrella
          persist-credentials: false

      - name: Read pins from subrepos.lock.json
        id: pins
        working-directory: umbrella
        run: |
          set -euo pipefail
          for name in renquant-orchestrator renquant-pipeline renquant-backtesting renquant-common renquant-base-data renquant-artifacts renquant-strategy-104 renquant-execution renquant-model; do
            PIN="$(python3 -c "import json,sys; print(next(e['commit'] for e in json.load(open('subrepos.lock.json'))['subrepos'] if e.get('name') == '$name'))")"
            test -n "${PIN}"
            key="$(echo "$name" | tr '-' '_')"
            echo "${key}=${PIN}" >> "$GITHUB_OUTPUT"
          done

      - name: Check out renquant-orchestrator at pin
        uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-orchestrator
          ref: ${{ steps.pins.outputs.renquant_orchestrator }}
          path: siblings/renquant-orchestrator
          persist-credentials: false
          token: ${{ secrets.SUBREPO_CI_READ_TOKEN || secrets.AGENT_GIT_PUSH_TOKEN || github.token }}

      - name: Check out renquant-pipeline at pin
        uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-pipeline
          ref: ${{ steps.pins.outputs.renquant_pipeline }}
          path: siblings/renquant-pipeline
          persist-credentials: false
          token: ${{ secrets.SUBREPO_CI_READ_TOKEN || secrets.AGENT_GIT_PUSH_TOKEN || github.token }}

      - name: Check out renquant-backtesting at pin
        uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-backtesting
          ref: ${{ steps.pins.outputs.renquant_backtesting }}
          path: siblings/renquant-backtesting
          persist-credentials: false
          token: ${{ secrets.SUBREPO_CI_READ_TOKEN || secrets.AGENT_GIT_PUSH_TOKEN || github.token }}

      - name: Check out renquant-common at pin
        uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-common
          ref: ${{ steps.pins.outputs.renquant_common }}
          path: siblings/renquant-common
          persist-credentials: false
          token: ${{ secrets.SUBREPO_CI_READ_TOKEN || secrets.AGENT_GIT_PUSH_TOKEN || github.token }}

      - name: Check out renquant-base-data at pin
        uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-base-data
          ref: ${{ steps.pins.outputs.renquant_base_data }}
          path: siblings/renquant-base-data
          persist-credentials: false
          token: ${{ secrets.SUBREPO_CI_READ_TOKEN || secrets.AGENT_GIT_PUSH_TOKEN || github.token }}

      - name: Check out renquant-artifacts at pin
        uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-artifacts
          ref: ${{ steps.pins.outputs.renquant_artifacts }}
          path: siblings/renquant-artifacts
          persist-credentials: false
          token: ${{ secrets.SUBREPO_CI_READ_TOKEN || secrets.AGENT_GIT_PUSH_TOKEN || github.token }}

      - name: Check out renquant-strategy-104 at pin
        uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-strategy-104
          ref: ${{ steps.pins.outputs.renquant_strategy_104 }}
          path: siblings/renquant-strategy-104
          persist-credentials: false
          token: ${{ secrets.SUBREPO_CI_READ_TOKEN || secrets.AGENT_GIT_PUSH_TOKEN || github.token }}

      - name: Check out renquant-execution at pin
        uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-execution
          ref: ${{ steps.pins.outputs.renquant_execution }}
          path: siblings/renquant-execution
          persist-credentials: false
          token: ${{ secrets.SUBREPO_CI_READ_TOKEN || secrets.AGENT_GIT_PUSH_TOKEN || github.token }}

      - name: Check out renquant-model at pin
        uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-model
          ref: ${{ steps.pins.outputs.renquant_model }}
          path: siblings/renquant-model
          persist-credentials: false
          token: ${{ secrets.SUBREPO_CI_READ_TOKEN || secrets.AGENT_GIT_PUSH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install OpenMP runtime (xgboost dylib dependency on macOS)
        run: brew install libomp

      - name: Install pinned packages
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          # Third-party deps come from the umbrella's committed, hashed lock —
          # never a live resolver (reviewed-environment contract). Subrepos
          # install --no-deps on top, in dependency order.
          # The umbrella lock was generated inside a conda env and carries
          # file:/// build paths for a few packages; those lines cannot
          # install in CI. Keep every resolvable pin, fall back to bare
          # names for the file:// entries (documented residual unpinning).
          awk '{ if ($0 ~ /@ file:\/\/\//) { split($0, a, " "); print a[1] } else print }' \
            umbrella/requirements.lock.txt > /tmp/req-ci.txt
          python3 -m pip install --quiet -r /tmp/req-ci.txt
          for p in renquant-common renquant-base-data renquant-artifacts renquant-strategy-104 renquant-execution renquant-model renquant-pipeline renquant-backtesting renquant-orchestrator; do
            python3 -m pip install --quiet --no-deps -e "siblings/$p"
          done

      - name: Import-integrity sweep against the PR lock
        run: |
          set -euo pipefail
          python3 umbrella/scripts/pin_import_integrity_sweep.py \
            --lock-file umbrella/subrepos.lock.json \
            --siblings siblings \
            --check-entrypoint

      # AC5 full-funnel closer (SHADOW). The sweep above proves every aliased
      # kernel import RESOLVES under the candidate pins; it does NOT prove the
      # decision Tasks EXECUTE. This step drives the real (synthetic, no-network)
      # scoring -> selection -> execution funnel through the actual package
      # contracts against the same candidate pin combination, catching runtime
      # breaks the import closure misses (a Task that imports fine but fails when
      # run). Readonly: paper broker, no --execute; writes only to /tmp.
      #
      # SHADOW ROLLOUT (bounded, promotion criterion in the progress doc):
      # continue-on-error keeps a funnel failure from blocking pin-bumps until it
      # has run GREEN across 3 real candidate-pin PRs; the outcome is written to
      # the job step-summary on every run so a shadow failure is NOT easy to
      # overlook. Promotion = after 3 green pin-bump PRs, a linked follow-up
      # removes continue-on-error (hard gate). AC5 is NOT hard-enforced until that
      # flip lands — see doc/progress/2026-07-20-ac5-pin-funnel-preflight.md.
      #
      # The funnel's own output directory does not survive the hosted runner
      # (codex review, 2026-07-21): a shadow FAIL with nothing but the
      # step-summary line is not actionable -- the decision/stage traces and
      # run bundle needed to diagnose it are gone the moment the job ends. The
      # artifact-upload step below (if: always()) preserves that output for
      # every run, pass or fail, with a bounded retention period, and the
      # step-summary links the exact artifact name so a shadow failure is
      # diagnosable from the Actions UI alone.
      - name: Execution-funnel preflight against the PR lock (SHADOW — AC5)
        id: ac5_funnel
        continue-on-error: true
        timeout-minutes: 15
        env:
          RENQUANT_SUBREPO_ROOT: ${{ github.workspace }}/siblings
        run: |
          set -uo pipefail
          python3 umbrella/scripts/subrepo_daily_contract.py \
            --broker-type paper \
            --run-id ac5-pin-funnel-preflight \
            --output-dir /tmp/ac5-funnel-out
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "### AC5 execution-funnel preflight: ✅ PASS (shadow)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### AC5 execution-funnel preflight: ❌ FAIL rc=$rc (shadow — did NOT block this PR)" >> "$GITHUB_STEP_SUMMARY"
            echo "A shadow FAIL means the candidate pins import-resolve but the decision funnel does not execute. Investigate before promotion; do NOT flip to a hard gate with a red shadow." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Funnel output dir: /tmp/ac5-funnel-out (run-id ac5-pin-funnel-preflight)" >> "$GITHUB_STEP_SUMMARY"
          echo "Full trace/run-bundle: uploaded as artifact 'ac5-funnel-output-${{ github.run_id }}' (see this job's Artifacts section, 14-day retention)." >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload AC5 funnel output (shadow diagnosis artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac5-funnel-output-${{ github.run_id }}
          path: /tmp/ac5-funnel-out
          retention-days: 14
          if-no-files-found: ignore
